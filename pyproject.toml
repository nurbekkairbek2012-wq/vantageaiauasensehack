[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage"
version = "0.1.0"
description = "VANTAGE — обнаружение несанкционированных свалок по спутниковым данным, оценка ущерба и прогноз риска"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Базовые зависимости: гео-пайплайн и CLI.
# Тяжёлые ML/сервисные части вынесены в extras, чтобы холодная установка была быстрой.
dependencies = [
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "odc-stac>=0.3.9",
    "rioxarray>=0.15",
    "xarray>=2023.9",
    "dask[array]>=2023.9",
    "numpy>=1.24,<2.1",
    "pandas>=2.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "scipy>=1.11",
    "requests>=2.31",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
]
service = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "python-telegram-bot>=21.0",
    "reportlab>=4.1",
    "python-multipart>=0.0.9",
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
vantage = "vantage.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vantage = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: тесты, которым нужен доступ в интернет (STAC, тайлы)",
    "slow: длительные тесты (обучение, полный пайплайн)",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
