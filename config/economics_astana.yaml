# Экономические допущения денежного слоя.
#
# Каждое значение здесь — ДОПУЩЕНИЕ, а не факт. Поэтому:
#   1) у каждого параметра есть min/typical/max — денежный слой считает
#      диапазон методом Монте-Карло, а не одну «уверенную» цифру;
#   2) у каждого параметра есть поле `source` одного из трёх видов:
#        source:   <ссылка на документ или прайс>  — подтверждённая величина
#        derived:  <формула вывода из подтверждённых величин>
#        estimate: <обоснование инженерной оценки>  — величины, которой
#                  в открытых источниках нет; проверяется чувствительностью
#      Поле, начинающееся с TODO, блокирует `vantage doctor`.
#
# Данные собраны 17 августа 2026 года. Перед защитой перепроверить курс МРП
# и прайсы приёмок — они меняются.

currency: KZT

# --------------------------------------------------------------------------- #
#  Базовые величины
# --------------------------------------------------------------------------- #

mrp_kzt:
  # Месячный расчётный показатель — база для всех штрафов в РК.
  value: 4325
  year: 2026
  source: "Закон РК о республиканском бюджете на 2026–2028 гг.; 1 МРП = 4325 ₸ с 01.01.2026 (в 2025 — 3932 ₸)"

waste_density_t_per_m3:
  # Плотность ТБО. Нормативное значение 0,25 т/м³ используется в методике
  # расчёта тарифа. Для стихийной свалки диапазон шире: она не уплотняется
  # катком, но содержит тяжёлую строительную фракцию.
  min: 0.15
  typical: 0.25
  max: 0.40
  source: "Методика расчёта тарифа на сбор, вывоз, утилизацию, переработку и захоронение ТБО (ИПС «Әділет», V1600014285 / V2100024382): расчётная плотность ТБО 0,25 т/м³"

depth_class_m:
  # Класс глубины присваивается моделью по текстуре поверхности и длине тени.
  shallow: { min: 0.2, typical: 0.4, max: 0.8 }
  medium:  { min: 0.6, typical: 1.2, max: 2.0 }
  deep:    { min: 1.5, typical: 2.5, max: 4.5 }
  estimate: "морфометрия по тени и текстуре; калибруется выездным замером объёма фотограмметрией (см. docs/CALIBRATION.md)"

# --------------------------------------------------------------------------- #
#  Стоимость ликвидации
# --------------------------------------------------------------------------- #

removal_cost_kzt_per_t:
  # Полная стоимость ликвидации: погрузка + транспортировка + захоронение.
  #
  # Прямого тарифа «за тонну» для Астаны в открытом доступе нет — тариф для
  # населения утверждается на человека в месяц (637 ₸ для благоустроенного
  # жилья, 679 ₸ для ИЖС с 09.03.2025). Поэтому величина выводится:
  #
  #   typical = 3832,5 ₸/м³ (полный тариф Алматы: сбор, транспортировка,
  #             сортировка, захоронение) ÷ 0,25 т/м³ ≈ 15 330 ₸/т
  #   min     = 5600 ₸/т — переработка и захоронение для юрлиц (Алматы),
  #             то есть нижняя граница без транспортного плеча
  #   max     = дальнее плечо вывоза + ручная погрузка на бездорожье
  min: 5600
  typical: 15330
  max: 26000
  derived: "тариф Алматы 3832,5 ₸/м³ ÷ плотность 0,25 т/м³; нижняя граница — 5600 ₸/т (переработка+захоронение для юрлиц, Алматы). ЗАМЕНИТЬ на прямой прайс оператора Астаны, если удастся получить"

transport_surcharge_per_km_kzt_per_t:
  # Надбавка за плечо вывоза сверх базового радиуса. Полигон Астаны —
  # Байконурский район, 7-й км трассы Алаш (направление Астана — Павлодар),
  # карта эксплуатируется с 2018 года, площадь 15,1 га, ёмкость 2 млн тонн.
  min: 25
  typical: 45
  max: 80
  base_radius_km: 15
  estimate: "оценка по стоимости самосвального километра; базовый радиус — расстояние до полигона на 7 км трассы Алаш"

# --------------------------------------------------------------------------- #
#  Извлекаемая ценность
# --------------------------------------------------------------------------- #

morphology:
  # Морфологический состав стихийной свалки по массе (сумма ≈ 1,0).
  # Отличается от городских ТБО: больше строительных отходов, меньше пищевых.
  construction: 0.35
  plastic:      0.13
  paper:        0.10
  metal:        0.04
  glass:        0.06
  textile:      0.05
  organic:      0.18
  other:        0.09
  estimate: "экспертная раскладка: стихийная свалка формируется вывозом строительного и крупногабаритного мусора, а не пищевых отходов. Подлежит уточнению выездным взвешенным отбором на 2-3 объектах"

recyclable_price_kzt_per_kg:
  # Прайс приёма вторсырья, г. Астана. Диапазон охватывает разницу между
  # ценой при самовывозе и при доставке на склад.
  plastic: { min: 50,  typical: 70,  max: 130 }   # ПЭТ-тара 50–100, полиэтилен 40–130
  paper:   { min: 20,  typical: 40,  max: 70 }    # картон 20–35, макулатура 40–70
  metal:   { min: 60,  typical: 120, max: 200 }   # алюминиевая банка 110–200; чёрный лом ниже
  glass:   { min: 3,   typical: 4,   max: 5 }     # стеклобой листовой 3–5
  source: "прайс-лист LS Ecolife, г. Астана (ls.com.kz/pages/price3.html), проверено 17.08.2026"

recovery_rate:
  # Реально извлекаемая доля от теоретического содержания.
  # Без этого коэффициента расчёт завышается в разы — главная ловушка
  # честности всего денежного слоя.
  plastic: { min: 0.15, typical: 0.30, max: 0.50 }
  paper:   { min: 0.05, typical: 0.15, max: 0.30 }   # мокрая и грязная макулатура не принимается
  metal:   { min: 0.50, typical: 0.75, max: 0.90 }
  glass:   { min: 0.20, typical: 0.40, max: 0.60 }
  estimate: "инженерная оценка: материал со стихийной свалки загрязнён и частично деградировал; бумага страдает сильнее всего, металл — меньше всего. Чувствительность результата к этим коэффициентам проверяется в Монте-Карло"

sorting_surcharge_share:
  # Насколько дороже вывоза обходится РАЗБОР на месте: отдельная бригада,
  # сортировка фракций на площадке и раздельные рейсы вместо одного
  # самосвала. Задаётся долей от стоимости обычного вывоза, а не суммой:
  # плечо и объём уже учтены в removal_cost_kzt_per_t, и повторять их
  # значит считать транспорт дважды.
  #
  # Этот параметр решает, что выгоднее делать с объектом, и потому назван
  # первым при любом разговоре о рекомендации. Точка безубыточности
  # считается по каждому объекту отдельно: разбор окупается, пока он
  # дешевле, чем стоит извлекаемое сырьё внутри кучи.
  min: 0.15
  typical: 0.30
  max: 0.50
  estimate: "инженерная оценка: ручная разборка и раздельные рейсы против одного самосвала на полигон. Прямого прайса на разбор стихийной свалки в открытом доступе нет; уточняется первым же коммерческим предложением подрядчика"

# --------------------------------------------------------------------------- #
#  Метан
# --------------------------------------------------------------------------- #

methane:
  # Модель разложения первого порядка (IPCC 2006, Vol.5 Ch.3, FOD).
  doc_fraction: { min: 0.10, typical: 0.15, max: 0.20 }
  doc_f: 0.5                        # доля DOC, реально разлагающаяся анаэробно
  methane_correction_factor: 0.4    # неуправляемая мелкая свалка (unmanaged, shallow)
  f_ch4_in_gas: 0.5                 # объёмная доля CH4 в свалочном газе
  oxidation_factor: 0.10            # окисление в покрывающем слое
  k_rate_per_year: { min: 0.03, typical: 0.06, max: 0.10 }   # умеренно сухой климат
  horizon_years: 20
  gwp_ch4_20yr: 82.5                # IPCC AR6, горизонт 20 лет
  gwp_ch4_100yr: 29.8               # IPCC AR6, горизонт 100 лет
  source: "IPCC 2006 Guidelines for National Greenhouse Gas Inventories, Vol.5 Ch.3 (First Order Decay); IPCC AR6 WG1 Ch.7 Table 7.15 (GWP метана)"

carbon_price_kzt_per_t_co2e:
  # Внутренняя цена углерода в системе торговли квотами РК.
  # Сделки на бирже проходили в диапазоне 400–560 ₸ за тонну CO2.
  # Верхняя граница отражает ожидаемый рост при запуске платных квот
  # и первичных аукционов.
  min: 400
  typical: 500
  max: 2000
  source: "торги углеродными единицами на товарной бирже РК: сделки в диапазоне 400–560 ₸/т CO2, средняя около 500 ₸; верхняя граница — ожидаемый рост при введении платных квот"

# --------------------------------------------------------------------------- #
#  Штрафы
# --------------------------------------------------------------------------- #

penalty:
  # ВАЖНО: штраф в РК назначается за факт правонарушения и зависит от
  # категории нарушителя, а НЕ от массы отходов. Умножать МРП на тонны —
  # методологическая ошибка, которую на Q&A заметят сразу.
  code: "КоАП РК"
  articles:
    dumping_with_vehicle:
      article: "ст. 344, ч. 2-1"
      title: "Образование стихийных свалок (выброс отходов вне специально установленных мест) с использованием транспортных средств"
      mrp:
        individual: 100          # физические лица
        official_or_small: 200   # должностные лица, малый бизнес, НКО
        medium: 500              # средний бизнес
        large: 1000              # крупный бизнес
      repeat_multiplier: 2       # повторно в течение года, с возможной конфискацией транспорта
    storage_outside_designated:
      article: "ст. 344, ч. 2"
      title: "Складирование отходов вне специально установленных мест, не предназначенных для их накопления или захоронения"
      mrp:
        individual: 50
        official_or_small: 100
      note: "для среднего бизнеса — 100% суммы экономической выгоды, для крупного — 200%"
    landscaping_rules:
      article: "ст. 505"
      title: "Нарушение правил благоустройства территорий городов и населённых пунктов"
      mrp:
        individual: 20
        official_or_small: 30
        medium: 40
        large: 100
  default_article: "dumping_with_vehicle"
  source: "Кодекс РК об административных правонарушениях от 05.07.2014 № 235-V, ст. 344 и ст. 505 (kodeksy-kz.com, проверено 17.08.2026)"

# --------------------------------------------------------------------------- #
#  Метод расчёта диапазона
# --------------------------------------------------------------------------- #

monte_carlo:
  # Диапазон ущерба считается методом Монте-Карло по треугольным
  # распределениям, а не перемножением крайних значений: перемножение
  # крайних даёт абсурдно широкий интервал, потому что предполагает,
  # что все допущения одновременно приняли минимальное (или максимальное)
  # значение — событие с исчезающе малой вероятностью.
  iterations: 20000
  seed: 42
  report_percentiles: [10, 50, 90]
