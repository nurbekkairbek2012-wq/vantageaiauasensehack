# Экономические допущения денежного слоя.
#
# ВАЖНО. Каждое значение здесь — это ДОПУЩЕНИЕ, а не факт. Поэтому:
#   1) у каждого параметра есть min/typical/max — денежный слой считает диапазон,
#      а не одну «уверенную» цифру (улучшение 7);
#   2) у каждого параметра есть поле `source` — на Q&A вопрос «откуда цифра»
#      закрывается ссылкой, а не догадкой.
#
# ПЕРЕД СДАЧЕЙ: заменить все source: TODO на реальные ссылки
# (сайт оператора вывоза, тарифы, прайс приёмок, публикации).

currency: KZT

waste_density_t_per_m3:
  # Насыпная плотность смешанных ТБО на стихийной свалке (уплотнение слабое)
  min: 0.15
  typical: 0.25
  max: 0.40
  source: "TODO: справочник по обращению с ТБО / методика расчёта объёмов"

depth_class_m:
  # Класс глубины присваивается моделью по текстуре и длине тени (money.py)
  shallow: { min: 0.2, typical: 0.4, max: 0.8 }
  medium:  { min: 0.6, typical: 1.2, max: 2.0 }
  deep:    { min: 1.5, typical: 2.5, max: 4.5 }

removal_cost_kzt_per_t:
  # Сбор + погрузка + транспортировка + захоронение
  min: 4000
  typical: 6500
  max: 11000
  source: "TODO: тариф оператора вывоза ТБО г. Астана"

transport_surcharge_per_km_kzt_per_t:
  # Надбавка за плечо вывоза сверх базового радиуса
  min: 25
  typical: 45
  max: 80
  base_radius_km: 15
  source: "TODO"

morphology:
  # Морфологический состав стихийной свалки (доли по массе, сумма ~1.0).
  # Отличается от городских ТБО: больше строительных отходов, меньше пищевых.
  construction: 0.35
  plastic:      0.13
  paper:        0.10
  metal:        0.04
  glass:        0.06
  textile:      0.05
  organic:      0.18
  other:        0.09
  source: "TODO: исследование морфологии ТБО РК"

recyclable_price_kzt_per_kg:
  # Цена приёмок Астаны за килограмм отсортированного сырья
  plastic: { min: 25,  typical: 60,  max: 120 }
  paper:   { min: 15,  typical: 30,  max: 55 }
  metal:   { min: 90,  typical: 180, max: 400 }
  glass:   { min: 3,   typical: 8,   max: 18 }
  source: "TODO: прайсы пунктов приёма вторсырья г. Астана"

recovery_rate:
  # Реально извлекаемая доля от теоретического содержания.
  # Без этого коэффициента цифры завышаются в разы — это ловушка честности.
  plastic: { min: 0.15, typical: 0.30, max: 0.50 }
  paper:   { min: 0.05, typical: 0.15, max: 0.30 }   # мокрая/грязная макулатура
  metal:   { min: 0.50, typical: 0.75, max: 0.90 }
  glass:   { min: 0.20, typical: 0.40, max: 0.60 }

methane:
  # Модель разложения первого порядка (IPCC 2006, Vol.5 Ch.3, FOD).
  # DOC — доля способного к разложению органического углерода.
  doc_fraction: { min: 0.10, typical: 0.15, max: 0.20 }
  doc_f: 0.5                 # доля DOC, реально разлагающаяся анаэробно
  methane_correction_factor: 0.4   # неуправляемая мелкая свалка (unmanaged, shallow)
  f_ch4_in_gas: 0.5          # объёмная доля CH4 в свалочном газе
  oxidation_factor: 0.10     # окисление в покрывающем слое
  k_rate_per_year: { min: 0.03, typical: 0.06, max: 0.10 }  # умеренно сухой климат
  horizon_years: 20
  gwp_ch4_20yr: 82.5         # IPCC AR6, горизонт 20 лет
  gwp_ch4_100yr: 29.8        # IPCC AR6, горизонт 100 лет
  source: "IPCC 2006 Guidelines Vol.5 Ch.3; IPCC AR6 WG1 Ch.7 Table 7.15"

carbon_price_kzt_per_t_co2e:
  # Внутренняя цена углерода (система торговли квотами РК)
  min: 500
  typical: 1200
  max: 3500
  source: "TODO: результаты торгов углеродными единицами РК"

penalty:
  # Штраф за несанкционированное размещение отходов.
  # ОБЯЗАТЕЛЬНО сверить статью и размер МРП перед сдачей.
  mrp_kzt: 3932              # TODO: МРП на текущий финансовый год
  code_article: "TODO: ст. Экологического кодекса РК / КоАП РК"
  base_mrp_per_ton: { min: 5, typical: 10, max: 20 }
  source: "TODO"

monte_carlo:
  # Диапазон ущерба считается методом Монте-Карло по треугольным распределениям
  # (min / typical / max), а не перемножением крайних значений — иначе
  # интервал получается абсурдно широким.
  iterations: 20000
  seed: 42
  report_percentiles: [10, 50, 90]
