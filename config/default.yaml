# VANTAGE — основная конфигурация пайплайна.
# Всё, что можно вынести из кода в данные, вынесено сюда: пороги, окна, границы.
# Правило: в коде нет ни одного «магического числа» — оно всегда здесь и имеет имя.

project:
  name: VANTAGE
  crs_working: "EPSG:32642"      # UTM 42N — метрическая проекция для Астаны
  crs_output: "EPSG:4326"        # WGS84 для выгрузки GeoJSON

aoi:
  # Область интереса по умолчанию: Астана и пригородная зона.
  # bbox в EPSG:4326 — [min_lon, min_lat, max_lon, max_lat]
  name: astana_ring
  bbox: [70.90, 50.88, 72.05, 51.42]
  # Опционально: путь к GeoJSON с более точной границей (перекрывает bbox)
  geojson: null

time:
  start: "2018-01-01"
  end: "2026-08-01"
  # Композиты строим помесячно: снимок раз в 5 суток → 3-6 наблюдений в месяц
  composite_freq: "MS"
  # Месяцы, пригодные для анализа в условиях Астаны:
  # зимой снег полностью маскирует спектральные признаки поверхности
  valid_months: [4, 5, 6, 7, 8, 9, 10]

sentinel2:
  collection: "sentinel-2-l2a"
  # Каналы, реально используемые в признаках (см. indices.py)
  bands: ["B02", "B03", "B04", "B08", "B11", "B12", "SCL"]
  resolution_m: 10
  # Максимальная доля облаков в сцене, выше — сцена не берётся вообще
  max_scene_cloud_pct: 60
  # Классы SCL, которые считаем непригодными (маскируем):
  # 0 no_data, 1 saturated, 3 cloud_shadow, 8 cloud_medium, 9 cloud_high,
  # 10 thin_cirrus, 11 snow
  scl_mask_classes: [0, 1, 3, 8, 9, 10, 11]
  # Минимальная доля валидных пикселей в месячном композите
  min_valid_fraction: 0.35

sentinel1:
  collection: "sentinel-1-rtc"
  polarizations: ["VV", "VH"]
  resolution_m: 10
  # Прокси когерентности: скользящая дисперсия обратного рассеяния.
  # Свалка нестабильна во времени → высокая дисперсия → низкая «когерентность».
  coherence_window_months: 6

landsat:
  collection: "landsat-c2-l2"
  # Тепловой канал: ST_B10 (Surface Temperature) в коллекции 2 level-2
  thermal_asset: "lwir11"
  resolution_m: 30
  # Тепловая аномалия считается относительно окружающего фона в радиусе:
  background_radius_m: 1000

change:
  # Детекция разрыва во временном ряду (см. change.py).
  # Минимальная длина стабильного участка до и после разрыва, месяцев
  min_segment_months: 6
  # Минимальная величина падения NDVI, чтобы считать разрыв значимым
  min_ndvi_drop: 0.12
  # Минимальный рост BSI
  min_bsi_rise: 0.06
  # Разрыв считается необратимым, если NDVI не вернулся к baseline
  # ближе чем на эту долю за окно восстановления
  recovery_tolerance: 0.5
  recovery_window_months: 18
  # Порог значимости разрыва (нормированная статистика CUSUM)
  breakpoint_zscore: 3.0

context:
  # Контекстный отсев (см. context.py). Все расстояния в метрах.
  max_distance_to_road_m: 300      # без подъезда свалка не образуется
  min_distance_to_settlement_m: 1500
  max_distance_to_settlement_m: 15000
  # Исключаемые классы землепользования OSM
  exclude_landuse:
    - landfill
    - quarry
    - construction
    - cemetery
    - industrial
    - farmland
    - farmyard
    - allotments
    - military
  exclude_natural: ["water", "wetland", "salt_pond"]
  # Минимальная площадь кандидата, м² (ниже — не разрешает Sentinel-2)
  min_area_m2: 900       # 3x3 пикселя по 10 м
  max_area_m2: 500000    # выше — это уже полигон, а не стихийная свалка

candidates:
  # Морфология при векторизации растровой маски
  opening_iterations: 1
  closing_iterations: 2
  simplify_tolerance_m: 5.0

chips:
  size_px: 64
  # Каналы чипа для сиамской сети: 6 спектральных + 3 производных признака
  bands: ["B02", "B03", "B04", "B08", "B11", "B12"]
  derived: ["ndvi", "bsi", "pmli"]

model:
  backbone: "resnet18"
  pretrained_source: "torchgeo:sentinel2_all_moco"   # веса, обученные на Sentinel-2
  embedding_dim: 128
  dropout: 0.3
  batch_size: 32
  epochs: 40
  lr: 3.0e-4
  weight_decay: 1.0e-4
  early_stopping_patience: 8
  # Порог вероятности для попадания в итоговый список
  decision_threshold: 0.65
  val_fraction: 0.2
  seed: 42

verify:
  # Мультипровайдерная доверификация (улучшение 12): порядок обхода.
  # Если провайдер недоступен/лимит — переходим к следующему, пайплайн не встаёт.
  providers: ["esri_wayback", "bing", "esri_current"]
  zoom: 17
  tile_grid: 3          # 3x3 тайла вокруг центроида
  timeout_s: 20
  max_candidates: 50
  # Порог согласия провайдеров, чтобы считать кандидата подтверждённым
  min_agreeing_providers: 2

removal:
  # Мультисигнальное подтверждение устранения (улучшение 15).
  # Нужно согласие минимум N признаков из 5 и подтверждение на M проходах подряд.
  min_agreeing_signals: 2
  consecutive_clear_passes: 2
  ndvi_recovery_threshold: 0.75   # доля от baseline
  # Предупреждение «возможно засыпано грунтом, а не расчищено»
  bsi_still_high_threshold: 0.10

risk:
  # Модель прогноза появления новых свалок (улучшение: слой 7)
  grid_cell_m: 500
  horizon_months: 12
  model: "lightgbm"
  n_estimators: 400
  learning_rate: 0.05
  max_depth: 7
  seed: 42
  # Публичная карта агрегируется до этой сетки (улучшение 16)
  public_grid_cell_m: 1000

api:
  host: "127.0.0.1"
  port: 8000
  # Ролевой доступ (улучшение 16)
  roles: ["public", "operator", "akimat", "admin"]
  public_precision_digits: 2   # округление координат в публичной выдаче

paths:
  data_raw: "data/raw"
  data_interim: "data/interim"
  data_cache: "data/cache"
  chips: "data/chips"
  models: "models"
  outputs: "outputs"
