# Области, по которым идёт поиск.
#
# ── Почему только Астана ────────────────────────────────────────────────
#
# Алматы и Шымкент убраны 22 августа 2026. По Алматы прогон отработал
# штатно и дал восемь объектов, из которых ноль оказались свалками:
# орошаемая пашня, оросительные пруды, заболоченные русла. Причина в ядре
# метода — детектор ищет место, где растительность исчезла навсегда, и
# поле, выведенное из оборота, ведёт себя ровно так же. Разбор в
# docs/ALMATY.md.
#
# Шымкент лежит в том же ландшафте и дал бы то же самое. Показывать город,
# в котором метод не работает, значит приглашать вопрос, на который нечего
# ответить кроме «да, там не работает».
#
# ── Почему областей несколько ───────────────────────────────────────────
#
# Одного кольца в 406 км² мало: оно плотно занято промзоной, железной
# дорогой и стройками, и настоящих свалок там единицы. Стихийные свалки
# возникают в пригородном поясе — у сёл, куда возят мусор из города, но
# где нет ни полигона, ни контроля.
#
# Поэтому взяты пояса вокруг Астаны с сёлами внутри: Коянды, Жибек Жолы,
# Нурлы, Аккайын, Костомар на востоке; Караоткель, Каражар, Талапкер,
# Нуресиль на западе.
#
# ── Как выбраны границы ─────────────────────────────────────────────────
#
# Замером scripts/probe_city.py, а не на глаз: по сетке 500 м считается
# доля земли, проходящей отсев одновременно по подъезду и по удалённости
# от жилья. У всех областей ниже она выше 20% — «хорошая область» по
# шкале, откалиброванной на прогонах, два из которых провалились.

cities:
  - id: astana
    name: Астана · северная промзона
    short: Север
    # Первое кольцо. Шесть полигонов ТБО в OSM, грузовое кольцо.
    # Годной земли 32,2% — по нему прошёл первый настоящий прогон.
    bbox: [71.37, 51.12, 71.66, 51.30]
    center: [51.21, 71.50]
    zoom: 11

  - id: astana_east
    name: Астана · восток
    short: Восток
    # Аккайын, Костомар, южная окраина Коянды.
    # Годной земли 23,3%.
    bbox: [71.66, 51.10, 71.95, 51.28]
    center: [51.19, 71.80]
    zoom: 11

  - id: astana_southeast
    name: Астана · юго-восток
    short: Юго-восток
    # Жибек Жолы, Нурлы, разъезд 42 — пояс вдоль дороги на Караганду.
    # Годной земли 24,5%, дорог 1205, населённых пунктов 14.
    bbox: [71.60, 51.02, 71.88, 51.18]
    center: [51.10, 71.74]
    zoom: 11

  - id: astana_west
    name: Астана · запад
    short: Запад
    # Караоткель, Каражар, Талапкер, Нуресиль — самый плотный пригород.
    # Годной земли 20,7%, дорог 2507, населённых пунктов 102: мест, куда
    # удобно свалить и где не сразу заметят, здесь больше всего.
    bbox: [71.08, 51.04, 71.36, 51.28]
    center: [51.16, 71.22]
    zoom: 11

  - id: astana_industrial_west
    name: Астана · западная промзона
    short: Промзона
    # Добавлено 23 августа после того, как три пригородных пояса дали ноль
    # настоящих свалок: там сельская земля, и детектор ловит залежь.
    #
    # Здесь промышленной земли 2,08% против 0,00% у восточного пояса и
    # 3,11% у северного кольца, которое работает. Годной земли 18,1%.
    #
    # Промышленность оказалась откалиброванным предсказателем: в промзоне
    # необратимое исчезновение растительности — редкое событие и потому
    # значимое, в поле — рядовое.
    bbox: [71.18, 51.06, 71.42, 51.22]
    center: [51.14, 71.30]
    zoom: 11

  - id: astana_south
    name: Астана · юг
    short: Юг
    # Найдена просмотром карты 23 августа, а не догадкой: scan_density.py
    # прошёл 35 клеток вокруг Астаны замером полноты карты и нашёл здесь
    # 150,4 контура на км² — больше, чем в работающем северном кольце
    # (94,7) и больше, чем где-либо ещё в агломерации.
    #
    # Три пригородных пояса до этого выбирались догадкой «у сёл больше
    # свалок» и дали 104 находки и ноль настоящих свалок. Эта область
    # выбрана замером, который стоил двенадцать минут.
    bbox: [71.38, 50.99, 71.58, 51.15]
    center: [51.07, 71.48]
    zoom: 11
