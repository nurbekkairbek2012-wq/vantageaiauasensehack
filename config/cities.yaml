# Города, по которым идёт поиск.
#
# ── Почему области небольшие ────────────────────────────────────────────
#
# Кольцо вокруг Астаны — 406 км², и это двадцать пять плиток по десять
# минут: четыре часа счёта на один город. Три города такого охвата — почти
# полсуток, и это при том, что сеть держится.
#
# Здесь области примерно по сто квадратных километров: шесть плиток, около
# часа. Три города проходят за вечер, а не за двое суток.
#
# ── Почему не центр города ──────────────────────────────────────────────
#
# Стихийные свалки возникают на окраине: там есть подъезд и нет тех, кто
# заметит. В центре детектор находит новостройки — исчезнувшая навсегда
# растительность выглядит одинаково и под свалкой, и под парковкой.
#
# Поэтому область смещена от центра к промышленной окраине. Направление
# выбрано по тому, где у города промзона и куда ведут грузовые дороги.

cities:
  - id: astana
    name: Астана
    # Северная промзона: шесть полигонов ТБО в OSM, грузовое кольцо.
    # Область больше остальных — по ней прошёл первый настоящий прогон.
    bbox: [71.37, 51.12, 71.66, 51.30]
    center: [51.21, 71.50]
    zoom: 11

  - id: almaty
    name: Алматы
    # ── Область перенесена в ночь на 22 августа 2026 ──────────────────
    #
    # Прежняя (76.78–76.94, 43.30–43.40) дала НОЛЬ объектов из 499
    # кандидатов, и разбор показал почему: медианное расстояние до жилья
    # там 196 метров при пороге отсева 1500. Область целиком лежала
    # внутри жилой застройки, где правило метода «ближе полутора
    # километров — заметят и без спутника» отсекает всё.
    #
    # Это не ошибка правила, а разница между городами. Вокруг Астаны за
    # промзоной начинается пустая степь; вокруг Алматы пригородный пояс
    # сплошной, и незастроенной земли с подъездом мало.
    #
    # Новая область выбрана замером, а не на глаз: по сетке 500 м
    # посчитана доля точек, удовлетворяющих правилу одновременно по
    # дороге и по жилью. Здесь её 25,9% против 11–14% у трёх других
    # проверенных направлений.
    bbox: [76.60, 43.40, 76.76, 43.50]
    center: [43.45, 76.68]
    zoom: 12

  - id: shymkent
    name: Шымкент
    # ── Область перенесена в ночь на 22 августа 2026 ──────────────────
    #
    # Прежняя (северная окраина по дороге на Тараз) дала ноль объектов из
    # 296 кандидатов. Замер объяснил почему: годной земли там ровно
    # **0,0%** — ни одна точка сетки 500 м не удовлетворяет правилу
    # одновременно по подъезду и по удалённости от жилья. Область целиком
    # застроена.
    #
    # Проверены пять направлений; доля годной земли:
    #     север (прежняя)   0,0%
    #     запад              0,3%
    #     юго-запад          9,3%
    #     северо-запад      13,8%
    #     восток            43,0%   ← выбрано
    bbox: [69.72, 42.28, 69.88, 42.38]
    center: [42.33, 69.80]
    zoom: 12
