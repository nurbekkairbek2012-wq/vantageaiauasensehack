# Города, по которым идёт поиск.
#
# ── Почему области небольшие ────────────────────────────────────────────
#
# Кольцо вокруг Астаны — 406 км², и это двадцать пять плиток по десять
# минут: четыре часа счёта на один город. Три города такого охвата — почти
# полсуток, и это при том, что сеть держится.
#
# Здесь области примерно по сто квадратных километров: шесть плиток, около
# часа. Три города проходят за вечер, а не за двое суток.
#
# ── Почему не центр города ──────────────────────────────────────────────
#
# Стихийные свалки возникают на окраине: там есть подъезд и нет тех, кто
# заметит. В центре детектор находит новостройки — исчезнувшая навсегда
# растительность выглядит одинаково и под свалкой, и под парковкой.
#
# Поэтому область смещена от центра к промышленной окраине. Направление
# выбрано по тому, где у города промзона и куда ведут грузовые дороги.

cities:
  - id: astana
    name: Астана
    # Северная промзона: шесть полигонов ТБО в OSM, грузовое кольцо.
    # Область больше остальных — по ней прошёл первый настоящий прогон.
    bbox: [71.37, 51.12, 71.66, 51.30]
    center: [51.21, 71.50]
    zoom: 11

  - id: almaty
    name: Алматы
    # Северо-западная окраина: промзона вдоль Кульджинского тракта,
    # за ней поля и сухие русла — обычное место сброса.
    bbox: [76.78, 43.30, 76.94, 43.40]
    center: [43.35, 76.86]
    zoom: 12

  - id: shymkent
    name: Шымкент
    # Северная окраина по дороге на Тараз: склады, базы, пустыри.
    bbox: [69.52, 42.34, 69.68, 42.44]
    center: [42.39, 69.60]
    zoom: 12
