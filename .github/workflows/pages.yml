name: Публикация сайта на GitHub Pages

# Сайт собирается Vite: лендинг и карта. Данные карты — статические
# GeoJSON из настоящего прогона, лежащие в web-next/public/data.
#
# Проверка на утечку осталась и осталась падающей. Она сторожит границу
# продукта, а не сборку: житель видит зону, служба видит точку. Белый
# список легко расширить одной строкой, и без падающего workflow этого
# никто не заметит до того момента, когда точные координаты уже в сети.

# Публикация идёт на каждый push в main — и это запасной аэродром, а не
# дубль ради дубля.
#
# Основной адрес живёт на Vercel, и 24 августа выяснилось, что он отдаёт
# страницу входа в Vercel, а не сайт: у проекта включена защита
# развёртывания. Для нас ссылка работает — мы залогинены, — а для любого
# постороннего это стена авторизации. Именно так её и увидел проверяющий.
#
# Отсюда правило: живая ссылка обязана открываться из окна в режиме
# инкогнито. Pages от такой ошибки застрахован — там нет ни защиты
# развёртывания, ни отдельного логина.
#
# Чтобы публикация заработала, нужно один раз включить Pages в настройках
# репозитория: Settings → Pages → Source: GitHub Actions.
#
# Пока не включено, сборка и проверки всё равно идут на каждый push, а шаг
# публикации пропускается — без ошибки. Раньше здесь стоял ручной запуск
# именно потому, что configure-pages падал на невключённом Pages, а
# постоянно красный значок хуже отсутствующего: он приучает не смотреть на
# значки. Теперь красным будет только настоящая поломка сборки.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Включён ли Pages в настройках репозитория. От этого зависит,
      # публиковать собранное или остановиться на проверках.
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-next/package-lock.json

      - name: Обновить данные карты из map-data, если она заполнена
        run: |
          # map-data/ наполняет `vantage publish` — он же проверяет белый
          # список. Если её нет, публикуются данные, уже лежащие в
          # web-next/public/data (результат прошлого прогона).
          if [ -d map-data ] && [ -n "$(ls -A map-data 2>/dev/null)" ]; then
            for file in candidates.geojson risk_public.geojson registry.geojson story.json metrics.json; do
              if [ -f "map-data/$file" ]; then
                cp "map-data/$file" web-next/public/data/
                echo "обновлён: $file"
              fi
            done
          else
            echo "map-data/ пуста — публикуем то, что уже лежит в web-next/public/data"
          fi
          ls -la web-next/public/data

      - name: Проверка утечки закрытых слоёв
        run: |
          leaked=0
          for forbidden in risk_private.geojson access.log citizen_reports.jsonl rejected.geojson; do
            if [ -e "web-next/public/data/$forbidden" ]; then
              echo "УТЕЧКА: $forbidden не должен публиковаться"
              leaked=1
            fi
          done
          if grep -rl '"risk"[[:space:]]*:' web-next/public/data/ 2>/dev/null | grep -q .; then
            echo "УТЕЧКА: в публичных данных есть поле risk (точная вероятность)"
            leaked=1
          fi
          test "$leaked" -eq 0 || exit 1
          echo "закрытых слоёв в публикации нет"

      - name: Собрать сайт
        working-directory: web-next
        run: |
          npm ci
          npm run build

      - name: Проверить, что собрались все страницы
        run: |
          # Список полный намеренно. Проверка «собрались обе страницы»
          # пережила появление ещё четырёх и молча пропустила бы сборку,
          # в которой половины сайта нет: Vite не считает пропущенную
          # точку входа ошибкой, он просто её не собирает.
          for file in index.html map.html economy.html timelapse.html                       forecast.html citizen.html label.html favicon.svg                       data/candidates.geojson data/economy.json; do
            test -f "web-next/dist/$file" || { echo "нет файла dist/$file"; exit 1; }
          done
          # Шрифты обязаны лежать локально: карта должна открываться без сети.
          test -n "$(ls web-next/dist/fonts/*.woff2 2>/dev/null)" || { echo "шрифты не попали в сборку"; exit 1; }
          du -sh web-next/dist

      - id: pages
        uses: actions/configure-pages@v5
        # Единственный шаг, который не может отработать без настройки
        # репозитория. Его падение — не поломка проекта, и валить из-за
        # него сборку нельзя.
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: web-next/dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
