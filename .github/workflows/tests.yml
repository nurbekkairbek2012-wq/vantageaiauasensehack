name: Тесты

# Зелёный значок на главной странице репозитория — это то, что жюри
# видит до того, как откроет хоть один файл кода.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml,service]"

      - name: Линтер
        run: ruff check src tests

      - name: Тесты
        run: pytest -q

      - name: Проверка готовности к сдаче
        run: vantage doctor
