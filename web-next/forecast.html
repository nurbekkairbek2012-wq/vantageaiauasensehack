<!doctype html>
<html lang="ru">
  <head>
    <!-- Тема ставится ДО первой отрисовки — синхронным скриптом с того же
         сайта (встроенный блокирует CSP). Подробности в самом файле. -->
    <script src="/theme-init.js"></script>
    <!-- Спутниковая плитка Esri — самый крупный элемент экрана (LCP), и
         грузится она только после запуска карты. Соединение открывается
         заранее, пока качаются скрипты. crossorigin — как у слоя плиток
         (basemaps.ts), иначе браузер не переиспользует соединение. -->
    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0918" />
    <!-- og:begin — вписано scripts/make_og_image.py, руками не править -->
    <meta name="description" content="Где риск появления новой свалки выше всего в ближайшие 12 месяцев." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vantage AI" />
    <meta property="og:title" content="Vantage AI — прогноз" />
    <meta property="og:description" content="Где риск появления новой свалки выше всего в ближайшие 12 месяцев." />
    <meta property="og:url" content="https://hakathon-lyart.vercel.app/forecast.html" />
    <meta property="og:image" content="https://hakathon-lyart.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- og:end -->
    <title>Vantage AI — прогноз</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-forecast.tsx"></script>
  </body>
</html>
