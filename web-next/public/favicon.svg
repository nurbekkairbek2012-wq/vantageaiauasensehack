<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Знак Vantage для вкладки браузера.

       Цвета зашиты числами, а не токенами: файл грузится браузером вне
       страницы, и переменных CSS в этом контексте не существует.

       Отрисовка мелкая: на вкладке знак занимает 16 физических пикселей,
       и контурная V с орбитой там превращаются в серое пятно. Остаётся
       силуэт буквы и метка — то, по чему вкладку узнают среди двадцати. -->
  <rect width="64" height="64" rx="14" fill="#0d0918"/>
  <path d="M9 15 L20 15 L28.2 39 L37.5 15 L48.5 15 L28.2 50 Z" fill="#ede9fe"/>
  <path d="M28.2 34.5a7 7 0 0 0-7 7c0 5.2 5.7 11 6.7 12 .2.2.4.2.6 0 1-1 6.7-6.8 6.7-12a7 7 0 0 0-7-7z" fill="#a78bfa"/>
  <circle cx="28.2" cy="41.5" r="2.6" fill="#0d0918"/>
</svg>
